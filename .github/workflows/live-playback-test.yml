name: Live Playback Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the live recovery test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          disable-animations: true
          script: >-
            bash -c '
            gradle --no-daemon :app:connectedBenchmarkAndroidTest -PlivePlaybackTest=true
            -Pandroid.testInstrumentationRunnerArguments.class=mnstudio.apps.mnstreamx.player.recovery.LivePlaybackRecoveryDeviceTest;
            test_status=$?;
            adb logcat -d -s MNX.LiveRecoveryTest:I | tee live-playback-log.txt;
            exit "$test_status"'

      - name: Upload playback test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-playback-test-results
          path: |
            live-playback-log.txt
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/