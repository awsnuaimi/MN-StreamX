name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. البحث عن مجلد المشروع (app, android, أو الجذر)
      - name: Detect project root
        id: detect
        run: |
          if [ -d "app" ] && [ -f "app/build.gradle" ]; then
            echo "root=app" >> $GITHUB_OUTPUT
            echo "📁 Project found in 'app' folder."
          elif [ -d "android" ] && [ -f "android/build.gradle" ]; then
            echo "root=android" >> $GITHUB_OUTPUT
            echo "📁 Project found in 'android' folder."
          else
            echo "root=." >> $GITHUB_OUTPUT
            echo "📁 Assuming root folder."
          fi

      # 2. إنشاء ملفات Gradle الأساسية إذا لم تكن موجودة
      - name: Ensure Gradle files exist
        run: |
          cd ${{ steps.detect.outputs.root }}
          
          # إنشاء settings.gradle إذا لم يكن موجوداً
          if [ ! -f settings.gradle ]; then
            echo "📄 Creating settings.gradle..."
            cat <<EOF > settings.gradle
            rootProject.name = "MN-StreamX"
            include ':app'
            EOF
          fi

          # إنشاء build.gradle الرئيسي إذا لم يكن موجوداً
          if [ ! -f build.gradle ]; then
            echo "📄 Creating build.gradle..."
            cat <<EOF > build.gradle
            buildscript {
                repositories {
                    google()
                    mavenCentral()
                }
                dependencies {
                    classpath 'com.android.tools.build:gradle:8.5.2'
                }
            }
            allprojects {
                repositories {
                    google()
                    mavenCentral()
                }
            }
            EOF
          fi

          # إنشاء app/build.gradle إذا لم يكن موجوداً (ضروري)
          if [ -d "app" ] && [ ! -f "app/build.gradle" ]; then
            echo "📄 Creating app/build.gradle..."
            cat <<EOF > app/build.gradle
            plugins {
                id 'com.android.application'
                id 'org.jetbrains.kotlin.android'
            }
            android {
                namespace 'com.yourapp.iptv'
                compileSdk 35
                defaultConfig {
                    applicationId 'com.yourapp.iptv'
                    minSdk 29
                    targetSdk 35
                    versionCode 1
                    versionName '1.0'
                }
                buildFeatures {
                    compose true
                }
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
                kotlinOptions {
                    jvmTarget = '17'
                }
            }
            dependencies {
                implementation 'androidx.core:core-ktx:1.13.1'
                implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
                implementation 'androidx.activity:activity-compose:1.9.1'
                implementation platform('androidx.compose:compose-bom:2024.09.03')
                implementation 'androidx.compose.ui:ui'
                implementation 'androidx.compose.material3:material3'
            }
            EOF
          fi

      # 3. إنشاء Gradle Wrapper
      - name: Generate Gradle Wrapper
        run: |
          cd ${{ steps.detect.outputs.root }}
          gradle wrapper
          chmod +x gradlew

      # 4. بناء APK
      - name: Build Debug APK
        run: |
          cd ${{ steps.detect.outputs.root }}
          ./gradlew assembleDebug

      # 5. رفع APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.detect.outputs.root }}/build/outputs/apk/debug/app-debug.apk