name: Build APK (Smart & Modern)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. سحب الكود
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. كشف تلقائي عن مسار المشروع (بدون افتراضات خاطئة)
      - name: Find Project Root
        id: find_root
        run: |
          if [ -f "settings.gradle" ] || [ -f "build.gradle" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
            echo "✅ Project found in root."
          elif [ -d "app" ] && [ -f "app/build.gradle" ]; then
            echo "dir=app" >> $GITHUB_OUTPUT
            echo "✅ Project found inside 'app' folder."
          elif [ -d "android" ] && [ -f "android/build.gradle" ]; then
            echo "dir=android" >> $GITHUB_OUTPUT
            echo "✅ Project found inside 'android' folder."
          else
            echo "dir=." >> $GITHUB_OUTPUT
            echo "⚠️ Could not detect standard structure, assuming root."
          fi

      # 4. أحدث إعداد لـ Gradle (v4 مع تخزين مؤقت ذكي)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # هذا يضمن أن الـ wrapper سيتم توليده إذا لم يكن موجوداً
          add-gradle-wrapper: true
          gradle-version: wrapper

      # 5. إعطاء صلاحيات التنفيذ
      - name: Make gradlew executable
        run: |
          cd ${{ steps.find_root.outputs.dir }}
          chmod +x gradlew

      # 6. بناء ملف APK
      - name: Build Debug APK
        run: |
          cd ${{ steps.find_root.outputs.dir }}
          ./gradlew assembleDebug

      # 7. رفع الملف الناتج (حتى لو تغير المسار، سيجده)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_root.outputs.dir }}/build/outputs/apk/debug/app-debug.apk