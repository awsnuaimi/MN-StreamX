name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper in isolation
        run: |
          if [ ! -f "gradlew" ]; then
            echo "⚙️ gradlew not found, generating wrapper in isolated temp dir..."
            mkdir -p /tmp/gradle-wrapper-gen
            cd /tmp/gradle-wrapper-gen
            gradle wrapper --gradle-version 8.5
            cp gradlew "$GITHUB_WORKSPACE/gradlew"
            cp gradlew.bat "$GITHUB_WORKSPACE/gradlew.bat"
            mkdir -p "$GITHUB_WORKSPACE/gradle/wrapper"
            cp gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.jar"
            echo "✅ Wrapper generated and copied successfully."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk