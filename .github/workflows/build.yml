name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. كشف المسار الصحيح للمشروع
      - name: Find Project Root
        id: find_root
        run: |
          if [ -f "settings.gradle" ] && [ -f "build.gradle" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -d "app" ] && [ -f "app/build.gradle" ]; then
            echo "dir=app" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      # 2. إنشاء ملفات Gradle الناقصة (بأسلوب echo الآمن، لا يوجد هنا <<EOF)
      - name: Ensure Gradle files exist
        run: |
          cd ${{ steps.find_root.outputs.dir }}
          
          # إنشاء مجلد app إذا لم يكن موجوداً
          if [ ! -d "app" ]; then
            mkdir app
          fi

          # إنشاء settings.gradle إذا كان مفقوداً
          if [ ! -f settings.gradle ]; then
            echo "rootProject.name = \"MN-StreamX\"" > settings.gradle
            echo "include ':app'" >> settings.gradle
          fi

          # إنشاء build.gradle الجذر إذا كان مفقوداً
          if [ ! -f build.gradle ]; then
            echo "buildscript {" > build.gradle
            echo "    repositories {" >> build.gradle
            echo "        google()" >> build.gradle
            echo "        mavenCentral()" >> build.gradle
            echo "    }" >> build.gradle
            echo "    dependencies {" >> build.gradle
            echo "        classpath 'com.android.tools.build:gradle:8.5.2'" >> build.gradle
            echo "    }" >> build.gradle
            echo "}" >> build.gradle
            echo "allprojects {" >> build.gradle
            echo "    repositories {" >> build.gradle
            echo "        google()" >> build.gradle
            echo "        mavenCentral()" >> build.gradle
            echo "    }" >> build.gradle
            echo "}" >> build.gradle
          fi

          # إنشاء app/build.gradle إذا كان مفقوداً
          if [ ! -f app/build.gradle ]; then
            echo "plugins {" > app/build.gradle
            echo "    id 'com.android.application'" >> app/build.gradle
            echo "    id 'org.jetbrains.kotlin.android'" >> app/build.gradle
            echo "}" >> app/build.gradle
            echo "android {" >> app/build.gradle
            echo "    namespace 'com.yourapp.iptv'" >> app/build.gradle
            echo "    compileSdk 35" >> app/build.gradle
            echo "    defaultConfig {" >> app/build.gradle
            echo "        applicationId 'com.yourapp.iptv'" >> app/build.gradle
            echo "        minSdk 29" >> app/build.gradle
            echo "        targetSdk 35" >> app/build.gradle
            echo "        versionCode 1" >> app/build.gradle
            echo "        versionName '1.0'" >> app/build.gradle
            echo "    }" >> app/build.gradle
            echo "    buildFeatures {" >> app/build.gradle
            echo "        compose true" >> app/build.gradle
            echo "    }" >> app/build.gradle
            echo "    compileOptions {" >> app/build.gradle
            echo "        sourceCompatibility JavaVersion.VERSION_17" >> app/build.gradle
            echo "        targetCompatibility JavaVersion.VERSION_17" >> app/build.gradle
            echo "    }" >> app/build.gradle
            echo "    kotlinOptions {" >> app/build.gradle
            echo "        jvmTarget = '17'" >> app/build.gradle
            echo "    }" >> app/build.gradle
            echo "}" >> app/build.gradle
            echo "dependencies {" >> app/build.gradle
            echo "    implementation 'androidx.core:core-ktx:1.13.1'" >> app/build.gradle
            echo "    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'" >> app/build.gradle
            echo "    implementation 'androidx.activity:activity-compose:1.9.1'" >> app/build.gradle
            echo "    implementation platform('androidx.compose:compose-bom:2024.09.03')" >> app/build.gradle
            echo "    implementation 'androidx.compose.ui:ui'" >> app/build.gradle
            echo "    implementation 'androidx.compose.material3:material3'" >> app/build.gradle
            echo "}" >> app/build.gradle
          fi

      # 3. إنشاء Gradle Wrapper وتنظيفه
      - name: Generate Gradle Wrapper
        run: |
          cd ${{ steps.find_root.outputs.dir }}
          gradle wrapper
          chmod +x gradlew

      # 4. بناء APK
      - name: Build Debug APK
        run: |
          cd ${{ steps.find_root.outputs.dir }}
          ./gradlew assembleDebug

      # 5. رفع APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_root.outputs.dir }}/build/outputs/apk/debug/app-debug.apk