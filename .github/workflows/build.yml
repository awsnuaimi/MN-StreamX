name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. كشف المسار الصحيح للمشروع
      - name: Find Project Root
        id: find_root
        run: |
          if [ -f "settings.gradle" ] && [ -f "build.gradle" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -d "app" ] && [ -f "app/build.gradle" ]; then
            echo "dir=app" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      # 2. إنشاء ملفات Gradle صحيحة تماماً (هذا هو الحل السحري)
      - name: Create correct Gradle files
        run: |
          cd ${{ steps.find_root.outputs.dir }}
          
          # إنشاء مجلد app إذا لم يكن موجوداً
          if [ ! -d "app" ]; then
            mkdir app
          fi

          # ---- 1. إنشاء settings.gradle ----
          echo "rootProject.name = \"MN-StreamX\"" > settings.gradle
          echo "include ':app'" >> settings.gradle

          # ---- 2. إنشاء build.gradle الرئيسي (مع classpath لكوتلن) ----
          cat > build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.24'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.2'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # ---- 3. إنشاء app/build.gradle (بأسلوب apply plugin) ----
          cat > app/build.gradle << 'EOF'
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          android {
              namespace 'com.yourapp.iptv'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.yourapp.iptv'
                  minSdk 29
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildFeatures {
                  compose true
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
              implementation 'androidx.activity:activity-compose:1.9.1'
              implementation platform('androidx.compose:compose-bom:2024.09.03')
              implementation 'androidx.compose.ui:ui'
              implementation 'androidx.compose.material3:material3'
          }
          EOF

      # 3. إنشاء Gradle Wrapper
      - name: Generate Gradle Wrapper
        run: |
          cd ${{ steps.find_root.outputs.dir }}
          gradle wrapper
          chmod +x gradlew

      # 4. بناء APK
      - name: Build Debug APK
        run: |
          cd ${{ steps.find_root.outputs.dir }}
          ./gradlew assembleDebug

      # 5. رفع APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_root.outputs.dir }}/build/outputs/apk/debug/app-debug.apk