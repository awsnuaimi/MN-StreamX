name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # خطوة فحص: نرى ما هي الملفات الموجودة حالياً
      - name: Check existing files
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la

      # خطوة سحرية: إنشاء ملفات Gradle الأساسية إذا كانت مفقودة
      - name: Ensure Gradle build files exist
        run: |
          if [ ! -f settings.gradle ]; then
            echo "Creating settings.gradle..."
            echo 'rootProject.name = "MN-StreamX"' > settings.gradle
            echo 'include ":app"' >> settings.gradle
          else
            echo "settings.gradle already exists."
          fi
          
          if [ ! -f build.gradle ]; then
            echo "Creating build.gradle..."
            echo "// Top-level build file where you can add configuration options common to all sub-projects/modules." > build.gradle
            echo "buildscript {" >> build.gradle
            echo "    repositories {" >> build.gradle
            echo "        google()" >> build.gradle
            echo "        mavenCentral()" >> build.gradle
            echo "    }" >> build.gradle
            echo "    dependencies {" >> build.gradle
            echo "        classpath 'com.android.tools.build:gradle:8.5.2'" >> build.gradle
            echo "    }" >> build.gradle
            echo "}" >> build.gradle
            echo "" >> build.gradle
            echo "allprojects {" >> build.gradle
            echo "    repositories {" >> build.gradle
            echo "        google()" >> build.gradle
            echo "        mavenCentral()" >> build.gradle
            echo "    }" >> build.gradle
            echo "}" >> build.gradle
          else
            echo "build.gradle already exists."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # الآن بعد أن أصبحت الملفات موجودة، نطلب من Gradle إنشاء Wrapper
      - name: Generate correct Gradle Wrapper
        run: |
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk