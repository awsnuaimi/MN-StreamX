name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. كشف المسار الصحيح للمشروع
      - name: Find Project Root
        id: find_root
        run: |
          if [ -f "settings.gradle" ] && [ -f "build.gradle" ]; then
            echo "dir=." >> $GITHUB_OUTPUT
          elif [ -d "app" ] && [ -f "app/build.gradle" ]; then
            echo "dir=app" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      # 2. الخطوة السحرية: إنشاء ملف gradlew إذا لم يكن موجوداً
      - name: Ensure Gradle Wrapper exists
        run: |
          cd ${{ steps.find_root.outputs.dir }}
          echo "Checking for gradlew..."
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found. Generating it now using 'gradle wrapper'..."
            gradle wrapper
          else
            echo "gradlew found."
          fi
          chmod +x gradlew

      # 3. بناء ملف APK
      - name: Build Debug APK
        run: |
          cd ${{ steps.find_root.outputs.dir }}
          ./gradlew assembleDebug

      # 4. رفع الملف الناتج
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ steps.find_root.outputs.dir }}/build/outputs/apk/debug/app-debug.apk