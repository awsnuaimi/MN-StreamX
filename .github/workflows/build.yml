name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      publish_update:
        description: 'Publish this signed build as a stable in-app update'
        required: false
        type: boolean
        default: false

env:
  MN_STREAMX_UPDATE_REPOSITORY: ${{ vars.MN_STREAMX_UPDATE_REPOSITORY || github.repository }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ runner.temp }}/mnx-native-ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ccache is separate from Gradle's user-home cache.  It stores only
      # compiled C/C++ objects, not signing keys, APKs, or downloaded sources.
      - name: Prepare optional native compiler cache
        id: native_cache
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null 2>&1; then
            # A failed optional package installation must never block APK builds.
            if ! (sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ccache); then
              echo '::warning::Unable to install ccache. Native compilation will continue normally.'
            fi
          fi
          if command -v ccache >/dev/null 2>&1; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'MN_STREAMX_ENABLE_CCACHE=1' >> "$GITHUB_ENV"
            ccache --version
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Native build cache unavailable; standard CMake build remains enabled.'
          fi

      - name: Restore native C/C++ compiler cache
        if: steps.native_cache.outputs.enabled == 'true'
        id: ccache_restore
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/mnx-native-ccache
          # Code-dependent key changes only when native inputs or AGP options change.
          # Restore older snapshots first; ccache validates all compiler inputs itself.
          key: mnx-ccache-v1-${{ runner.os }}-ndk27.2.12479018-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle') }}
          restore-keys: |
            mnx-ccache-v1-${{ runner.os }}-ndk27.2.12479018-

      - name: Initialize native cache measurements
        if: steps.native_cache.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          if ! ccache --max-size "$CCACHE_MAXSIZE" || ! ccache --zero-stats; then
            echo '::warning::ccache initialization failed. Falling back to normal CMake compilation.'
            echo 'MN_STREAMX_ENABLE_CCACHE=0' >> "$GITHUB_ENV"
          fi

      - name: Test update publishing rules
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Validate benchmark Python tooling
        run: python -m unittest discover -s tools -p 'test_*.py' -v

      - name: Verify bounded Whisper live windows
        shell: bash
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            tools/tests/test_whisper_live_window.cpp -o "$RUNNER_TEMP/whisper-window-test"
          "$RUNNER_TEMP/whisper-window-test"
          cmake -P tools/tests/whisper_window_patch_test.cmake

      - name: Finish verified code namespace migration
        run: python tools/finish_namespace_migration.py --apply

      - name: Unit tests, lint, and device benchmark compilation
        run: bash .github/scripts/profile_gradle.sh verify testDebugUnitTest lintDebug :app:compileBenchmarkAndroidTestKotlin

      - name: Build and verify signed update APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          MN_STREAMX_KEYSTORE_BASE64: ${{ secrets.MN_STREAMX_KEYSTORE_BASE64 }}
          MN_STREAMX_KEYSTORE_PASSWORD: ${{ secrets.MN_STREAMX_KEYSTORE_PASSWORD }}
          MN_STREAMX_KEY_ALIAS: ${{ secrets.MN_STREAMX_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: e98e41392fce88510133fb80886e23d165be507ca50ce98be7163b0e42b3ccb2
        run: |
          set -euo pipefail
          for required_secret in MN_STREAMX_KEYSTORE_BASE64 MN_STREAMX_KEYSTORE_PASSWORD MN_STREAMX_KEY_ALIAS; do
            if [[ -z "${!required_secret}" ]]; then
              echo "::error::Missing repository secret: $required_secret"
              exit 1
            fi
          done
          umask 077
          export MN_STREAMX_KEYSTORE_FILE="$RUNNER_TEMP/mn-streamx-app-signing.p12"
          certificate_path="$RUNNER_TEMP/mn-streamx-signing-cert.der"
          trap 'rm -f "$MN_STREAMX_KEYSTORE_FILE" "$certificate_path"' EXIT
          expected_cert="${EXPECTED_CERT_SHA256,,}"
          if [[ ! "$expected_cert" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::EXPECTED_CERT_SHA256 must contain exactly 64 hexadecimal characters."
            exit 1
          fi
          printf 'Expected certificate SHA-256: %s\n' "$expected_cert"
          printf '%s' "$MN_STREAMX_KEYSTORE_BASE64" | base64 --decode > "$MN_STREAMX_KEYSTORE_FILE"
          keytool -exportcert -storetype PKCS12 \
            -keystore "$MN_STREAMX_KEYSTORE_FILE" \
            -alias "$MN_STREAMX_KEY_ALIAS" \
            -storepass:env MN_STREAMX_KEYSTORE_PASSWORD \
            -file "$certificate_path" > /dev/null
          repository_cert="$(sha256sum "$certificate_path" | cut -d ' ' -f1)"
          printf 'Repository certificate SHA-256: %s\n' "$repository_cert"
          if [[ "$repository_cert" != "$expected_cert" ]]; then
            echo "::error::The repository signing certificate differs from the Termux certificate. Check MN_STREAMX_KEYSTORE_BASE64."
            exit 1
          fi
          # Isolate AGP's release manifest task from native CMake compilation.
          # This is a measured, reversible preflight; the signed APK is still
          # produced and verified by the same assembleRelease invocation.
          bash .github/scripts/profile_gradle.sh manifest :app:processReleaseManifestForPackage
          bash .github/scripts/profile_gradle.sh release assembleRelease

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          signer_path="$(printf '%s\n' "$sdk_root"/build-tools/*/apksigner | sort -V | tail -n 1)"
          if [[ ! -x "$signer_path" ]]; then
            echo "::error::Android apksigner was not found."
            exit 1
          fi
          version_code=$((100000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          version_name="1.1.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          aapt_path="${signer_path%/apksigner}/aapt"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk_path="app/build/outputs/apk/release/app-${abi}-release.apk"
            if [[ ! -f "$apk_path" ]]; then
              echo "::error::Missing signed APK for ${abi}: $apk_path"
              exit 1
            fi
            signing_report="$("$signer_path" verify --print-certs "$apk_path")"
            actual_cert="$(
              printf '%s\n' "$signing_report" |
                awk '
                  /^[[:space:]]*(Signer([[:space:]]+#[0-9]+)?|V[0-9]+(\.[0-9]+)?[[:space:]]+Signer([[:space:]]+#[0-9]+)?):?[[:space:]]+certificate SHA-256 digest:/ {
                    digest = $NF
                    sub(/\r$/, "", digest)
                    if (length(digest) == 64 && digest !~ /[^0-9A-Fa-f]/) {
                      print tolower(digest)
                    }
                  }
                ' | sort -u
            )"
            printf '%s APK certificate SHA-256: %s\n' "$abi" "${actual_cert:-not found}"
            if [[ ! "$actual_cert" =~ ^[0-9a-f]{64}$ ]]; then
              printf '%s\n' "$signing_report"
              echo "::error::Cannot read unique certificate digest for $abi"
              exit 1
            fi
            if [[ "$actual_cert" != "$expected_cert" ]]; then
              echo "::error::Signing certificate mismatch for $abi"
              exit 1
            fi
            badging="$("$aapt_path" dump badging "$apk_path")"
            package_line="${badging%%$'\n'*}"
            if [[ "$package_line" != *"name='mnstudio.apps.mnstreamx'"* || "$package_line" != *"versionCode='$version_code'"* ]]; then
              echo "::error::Package ID or version code mismatch for $abi"
              exit 1
            fi
            output="dist/MN-StreamX-${version_name}-${abi}.apk"
            cp "$apk_path" "$output"
            printf '%s: %s MiB\n' "$abi" "$(du -m "$output" | cut -f1)"
            printf ' - `%s` (%s MiB)\n' "$(basename "$output")" "$(du -m "$output" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done
          printf '\nVersion: %s | Version code: %s | Certificate SHA-256: `%s`\n' \
            "$version_name" "$version_code" "$expected_cert" >> "$GITHUB_STEP_SUMMARY"

      - name: Record native compiler cache statistics
        if: ${{ always() && steps.native_cache.outputs.enabled == 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p build/ci-metrics
          ccache --show-stats | tee build/ci-metrics/native-ccache-stats.txt
          {
            echo '### Native C/C++ compiler cache'
            echo
            echo 'Stats are also available in the `MN-StreamX-ci-diagnostics` artifact.'
            echo
            echo '```text'
            ccache --show-stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save native compiler cache
        if: ${{ success() && github.ref == 'refs/heads/main' && steps.native_cache.outputs.enabled == 'true' && steps.ccache_restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/mnx-native-ccache
          key: mnx-ccache-v1-${{ runner.os }}-ndk27.2.12479018-${{ hashFiles('app/src/main/cpp/**', 'app/build.gradle') }}

      # Parse Gradle's own HTML profiles; never add an init script to Gradle.
      # Analysis failures must not block a verified signed APK or hide test logs.
      - name: Summarize Release and Manifest timing
        if: ${{ always() }}
        continue-on-error: true
        run: |
          python .github/scripts/gradle_profile_summary.py \
            --profiles build/reports/profile \
            --metrics build/ci-metrics/gradle-steps.tsv \
            --output build/ci-metrics/gradle-task-summary.txt

      # Keep profiles and failing test reports even if validation or signing fails.
      - name: Upload Gradle performance and test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: MN-StreamX-ci-diagnostics
          path: |
            build/ci-metrics/gradle-steps.tsv
            build/ci-metrics/gradle-task-summary.txt
            build/ci-metrics/native-ccache-stats.txt
            **/build/reports/profile/*.html
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

      - name: Upload signed update APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: MN-StreamX-update-apk
          path: dist/*.apk
          if-no-files-found: error

  publish:
    name: Publish stable in-app update
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_update))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: mn-streamx-stable-update
      cancel-in-progress: false
    steps:
      - name: Checkout publishing script
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download verified signed APKs
        uses: actions/download-artifact@v4
        with:
          name: MN-StreamX-update-apk
          path: dist
      - name: Publish complete verified release
        env:
          GH_TOKEN: ${{ secrets.MN_STREAMX_UPDATE_TOKEN || github.token }}
        run: python .github/scripts/publish_update.py