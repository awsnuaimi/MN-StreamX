    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.4'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.9.1'

    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.navigation:navigation-compose:2.8.0'

    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-compiler:$hilt_version"
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation platform('androidx.compose:compose-bom:2024.09.03')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
// Preserve upstream native-runtime notices in every distributed APK.
// This public text is fetched at build time, bounded and pinned, not at player startup.
def captionNotices = tasks.register('prepareCaptionNotices') {
    def target = layout.buildDirectory.file('generated/captionNotices/onnxruntime-ThirdPartyNotices.txt')
    def expected = 'cf7342f7ba482ef715ae58f5f497a8d3564fa255164175aea324cd293c5701a0'
    inputs.property('noticeSha256', expected)
    outputs.file(target)
    doLast {
        def destination = target.get().asFile
        destination.parentFile.mkdirs()
        def temporary = new File(destination.parentFile, 'notice.part')
        try {
            def connection = new URL('https://raw.githubusercontent.com/microsoft/onnxruntime/v1.20.0/ThirdPartyNotices.txt').openConnection()
            connection.connectTimeout = 30000
            connection.readTimeout = 30000
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            connection.inputStream.withCloseable { input ->
                temporary.withOutputStream { output ->
                    byte[] buffer = new byte[16384]
                    long total = 0
                    int count
                    while ((count = input.read(buffer)) != -1) {
                        total += count
                        if (total > 600000) throw new GradleException('Caption notice exceeds its pinned size limit.')
                        output.write(buffer, 0, count)
                        digest.update(buffer, 0, count)
                    }
                }
            }
            if (digest.digest().encodeHex().toString() != expected) throw new GradleException('Caption notice checksum mismatch.')
            java.nio.file.Files.move(temporary.toPath(), destination.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } finally { temporary.delete() }
    }
}
tasks.named('preBuild').configure { dependsOn(captionNotices) }