    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.2'
    implementation 'ai.moonshine:moonshine-voice:0.1.6'
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'com.microsoft.cognitiveservices.speech:client-sdk:1.51.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation "androidx.media3:media3-exoplayer-hls:$media3_version"
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.4'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.9.1'

    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.navigation:navigation-compose:2.8.0'

    implementation "com.google.dagger:hilt-android:$hilt_version"
    kapt "com.google.dagger:hilt-compiler:$hilt_version"
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    implementation "androidx.media3:media3-exoplayer:$media3_version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3_version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3_version"
    implementation "androidx.media3:media3-ui:$media3_version"
    implementation "androidx.media3:media3-session:$media3_version"

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.benchmark:benchmark-junit4:1.3.3'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation platform('androidx.compose:compose-bom:2024.09.03')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
// Package pinned notices from source; building does not fetch licenses over the network.
def captionNotices = tasks.register('prepareCaptionNotices') {
    def source = layout.projectDirectory.file('src/main/assets/onnxruntime-ThirdPartyNotices.txt')
    def expected = 'e9e90971a8e75a9a8ac0c6412e29c1202d079998389915aa485f46c816c3b4cc'
    inputs.file(source)
    inputs.property('noticeSha256', expected)
    doLast {
        def notice = source.asFile
        if (!notice.isFile() || java.security.MessageDigest.getInstance('SHA-256').digest(notice.bytes).encodeHex().toString() != expected)
            throw new GradleException('The pinned ONNX Runtime notice is missing or changed.')
    }
}
tasks.named('preBuild').configure { dependsOn(captionNotices) }