plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'dagger.hilt.android.plugin'
    id 'androidx.room'
}

def positiveNumber = { String raw, String label ->
    if (raw == null || !(raw ==~ /[1-9][0-9]*/) || raw.length() > 10) {
        throw new GradleException("${label} must be a positive integer.")
    }
    return Long.parseLong(raw)
}
def ciRun = System.getenv('GITHUB_RUN_NUMBER')
def runNumber = ciRun ? positiveNumber(ciRun, 'GITHUB_RUN_NUMBER') : 0L
def runAttempt = runNumber ? positiveNumber(System.getenv('GITHUB_RUN_ATTEMPT') ?: '1', 'GITHUB_RUN_ATTEMPT') : 1L
if (runAttempt > 99L) throw new GradleException('Run attempts above 99 require a new workflow run.')
def explicitVersion = providers.gradleProperty('appVersionCode').orNull
def updateVersionCode = explicitVersion ? positiveNumber(explicitVersion, 'appVersionCode') :
    (runNumber ? 100000L + runNumber * 100L + runAttempt : 2L)
if (updateVersionCode > 2100000000L) throw new GradleException('versionCode exceeds the Android limit.')
def updateVersionName = providers.gradleProperty('appVersionName').orNull ?:
    (runNumber ? "1.1.${runNumber}.${runAttempt}" : '1.1.0')

def stableStore = System.getenv('MN_STREAMX_KEYSTORE_FILE')
def stablePassword = System.getenv('MN_STREAMX_KEYSTORE_PASSWORD')
def stableAlias = System.getenv('MN_STREAMX_KEY_ALIAS')
def suppliedValues = [stableStore, stablePassword, stableAlias].count { it != null && !it.isEmpty() }
if (suppliedValues > 0 && suppliedValues < 3) {
    throw new GradleException('Incomplete MN StreamX signing environment: provide the keystore file, password, and alias.')
}
def stableSigningReady = suppliedValues == 3
if (stableSigningReady && !file(stableStore).isFile()) {
    throw new GradleException('The configured MN StreamX signing keystore does not exist.')
}

android {
    namespace 'com.yourapp.iptv'
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId 'com.yourapp.iptv'
        minSdk 29
        targetSdk 35
        versionCode updateVersionCode.toInteger()
        versionName updateVersionName
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                targets 'mnx-whisper'
                def localWhisper = providers.gradleProperty('captionWhisperSource').orNull
                if (localWhisper) arguments "-DWHISPER_SOURCE_DIR=${localWhisper}"
                def localPieces = providers.gradleProperty('captionSentencePieceSource').orNull
                if (localPieces) arguments "-DSENTENCEPIECE_SOURCE_DIR=${localPieces}"
            }
        }
    }

    signingConfigs {
        if (stableSigningReady) {
            stable {
                storeFile file(stableStore)
                storeType 'PKCS12'
                storePassword stablePassword
                keyAlias stableAlias
                keyPassword stablePassword
            }
        }
    }
    buildTypes {
        debug {
            if (stableSigningReady) signingConfig signingConfigs.stable
        }
        release {
            debuggable false
            minifyEnabled false
            if (stableSigningReady) signingConfig signingConfigs.stable
        }
    }

    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }

    // One APK per Android ABI: smaller sideload/update footprint on low-storage TVs.
    // All outputs retain the same application ID, version code and signing certificate.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk false
        }
    }

    sourceSets.main.assets.srcDir(layout.buildDirectory.dir("generated/captionNotices"))

    // Azure Speech's Netty dependencies publish duplicate packaging metadata.
    // Keep service registrations and executable resources intact. The Netty
    // version properties are diagnostic metadata, not runtime class files.
    // These two exclusions match the Azure Speech Android sample configuration.
    packaging {
        resources {
            excludes.add('/META-INF/INDEX.LIST')
            excludes.add('/META-INF/io.netty.versions.properties')
        }
    }

    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    room {
        schemaDirectory("$projectDir/schemas")
    }
}

tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.doFirst {
            if (!stableSigningReady) {
                throw new GradleException('Release signing is required. Configure the MN_STREAMX signing secrets first.')
            }
        }
    }
}

